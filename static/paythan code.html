<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>KING HACK 2.0 - KING AI EDITION</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">

<style>
:root {
    --gold-main: #ffd700;
    --gold-bright: #fff580;
    --gold-glow: 0 0 20px #ffd700, 0 0 40px #ff8800;
    --panel-bg: linear-gradient(180deg, #4b0000 0%, #1a0000 100%);
    --button-gold: linear-gradient(180deg, #fff200 0%, #ff8800 100%);
}

* { margin:0; padding:0; box-sizing:border-box; font-family:'Rajdhani',sans-serif; }
body { background:#000; overflow:hidden; width: 100vw; height: 100vh; }

#bg-frame { position: fixed; inset: 0; width: 100%; height: 100%; border: none; z-index: 1; }

#mini {
    position: fixed; right: 20px; bottom: 100px; width: 65px; height: 65px;
    border-radius: 50%; display: flex; align-items: center; justify-content: center;
    cursor: pointer; z-index: 9999; background: radial-gradient(circle,#4d0000,#120000);
    border: 2px solid var(--gold-main); box-shadow: var(--gold-glow);
}
#mini img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }

#main {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 360px; display: none; flex-direction: column; overflow: hidden;
    border-radius: 18px; border: 2.5px solid var(--gold-main);
    background: var(--panel-bg); box-shadow: var(--gold-glow); z-index: 10000;
}

.header {
    padding: 12px; display: flex; justify-content: space-between; align-items: center;
    background: transparent; border-bottom: 2px solid rgba(255, 215, 0, 0.6);
    cursor: move;
}

.title-text {
    font-family: 'Cinzel', serif; font-size: 14px; font-weight: 900;
    color: var(--gold-main); text-shadow: 0 0 10px var(--gold-main);
}

.close-btn { color: #fff; cursor: pointer; font-weight: bold; font-size: 18px; }
.inner { padding: 18px; text-align: center; }

.login-box {
    border: 2px solid var(--gold-main); border-radius: 12px;
    padding: 15px 10px; margin-bottom: 15px;
    background: rgba(0, 0, 0, 0.5); box-shadow: inset 0 0 15px rgba(255, 215, 0, 0.3);
}

[contenteditable="true"] { outline: none; cursor: text; }
[contenteditable="true"]:focus { background: rgba(255, 215, 0, 0.15); border-radius: 4px; }

.res-text {
    font-family: 'Cinzel', serif; font-size: 28px; font-weight: 900;
    color: #fff; text-shadow: 0 0 20px var(--gold-main), 0 0 5px #fff;
    margin: 10px 0; display: block;
}

.btn-gold {
    width: 100%; padding: 14px; border: 1.5px solid var(--gold-bright); border-radius: 30px;
    cursor: pointer; font-size: 12px; font-family: 'Cinzel', serif; font-weight: 900;
    background: var(--button-gold); color: #000;
    box-shadow: 0 0 20px rgba(255, 215, 0, 0.7);
    text-transform: uppercase; transition: 0.3s;
}
.btn-gold:hover { box-shadow: 0 0 30px var(--gold-main); transform: scale(1.02); }
.small-btn { padding:6px 10px; border-radius:8px; }
</style>
</head>
<body>

<iframe id="bg-frame" src="about:blank"></iframe>

<div id="mini" onclick="openM()">
    <img src="https://i.postimg.cc/3xB9f7wM/1000013396.jpg">
</div>

<div id="main">
    <div class="header" id="dragHandle">
        <span class="title-text" contenteditable="true">KING AI V2.0</span>
        <span class="close-btn" onclick="closeM()">✖</span>
    </div>

    <div class="inner">
        <div id="login-view">
            <div class="login-box">
                <span style="font-family: 'Cinzel'; color: var(--gold-main); font-weight: 900;" contenteditable="true">⚠ KING SERVER</span>
                <p style="font-size: 11px; color: #ccc; margin-top: 8px;">INJECTING AI LOGIC... (Static Demo)</p>
            </div>
            <button class="btn-gold" onclick="showPredictor()">OPEN PANEL</button>
        </div>

        <div id="prediction-ui" style="display: none; text-align:left;">
            <div class="login-box" style="text-align:left;">
                <p style="color:var(--gold-main); font-size:12px; font-weight:bold; text-shadow: 0 0 5px var(--gold-main);">USER PANEL</p>
                <span class="res-text" id="resultDisplay" contenteditable="true" style="font-size:18px;">READY</span>
                <p id="periodDisplay" style="color:#fff; font-size:11px; font-weight: bold;" contenteditable="true">PERIOD: Static</p>

                <div style="margin-top:10px;">
                  <button class="small-btn" onclick="goToPanel()">Open Full Panel</button>
                  <button class="small-btn" onclick="generateCredsPrompt()">Generate ID/Password</button>
                </div>
            </div>
            <div style="display:flex; gap:8px; margin-top:8px;">
              <button class="btn-gold" onclick="startKINGLogic()">GET RESULT</button>
              <button class="btn-gold" onclick="logoutAndClose()">Logout</button>
            </div>
        </div>
    </div>
</div>

<script src="/static/js/app.js"></script>
<script>
let lastNumbers = [2,4,6,8,1,3,5,7,9,0];
function openM(){document.getElementById('main').style.display='flex';document.getElementById('mini').style.display='none';}
function closeM(){document.getElementById('main').style.display='none';document.getElementById('mini').style.display='flex';}
function showPredictor(){document.getElementById('login-view').style.display='none';document.getElementById('prediction-ui').style.display='block';}
function goToPanel(){ window.location.href = '/static/panel.html'; }
function logoutAndClose(){ window.StaticApp.logout(); closeM(); }

function updatePeriod(){ const now=new Date(); const periodId = now.getUTCFullYear()+""+(now.getUTCMonth()+1).toString().padStart(2,'0')+""+now.getUTCDate().toString().padStart(2,'0')+"1000"+(10001+Math.floor(now.getUTCMinutes()+(now.getUTCHours()*60))); document.getElementById('periodDisplay').innerText = 'PERIOD: '+periodId; return periodId; }

function startKINGLogic(){ const res=document.getElementById('resultDisplay'); const prdText=updatePeriod().slice(-5); const periodInt=parseInt(prdText);
    res.style.opacity='0.5'; res.innerText='AI ANALYZING...';
    setTimeout(()=>{
        let baseCalc = ((periodInt * 73) - (periodInt % 43)) % 10;
        let weights = [0.05,0.1,0.15,0.2,0.25,0.25]; let weightedSum=0; lastNumbers.slice(-6).forEach((num,i)=>{ weightedSum+=num*weights[i]; }); let aiFactor=(weightedSum + periodInt*0.7) % 10; let finalVal=(baseCalc+aiFactor)/2; let prediction = finalVal>=5? 'BIG' : 'SMALL'; let luckyNum=Math.floor(finalVal + (Math.random()*2)); if(luckyNum>9) luckyNum=9; res.style.opacity='1'; res.innerText = prediction + ' ' + luckyNum; lastNumbers.push(luckyNum); if(lastNumbers.length>10) lastNumbers.shift();
    },1500);
}

// Credential generation prompt
async function generateCredsPrompt(){
  const username = prompt('Enter desired username (or leave blank for random):');
  let uname = username && username.trim() ? username.trim() : 'user' + Math.floor(Math.random()*9000+1000);
  const password = prompt('Enter a password (or leave blank to generate):');
  let pwd = password && password.length ? password : Math.random().toString(36).slice(-8) + Math.floor(Math.random()*90+10);
  // Submit an approval request for account creation
  const r = await window.StaticApp.requestAccountCreation(uname, pwd);
  alert(r.message);
}

function dragStart(e){ if(e.target.hasAttribute('contenteditable')) return; isDragging=true; const clientX=e.touches?e.touches[0].clientX:e.clientX; const clientY=e.touches?e.touches[0].clientY:e.clientY; offset.x = clientX - panel.offsetLeft; offset.y = clientY - panel.offsetTop; }

// Draggable
const panel = document.getElementById('main'); const dragHandle = document.getElementById('dragHandle'); let isDragging=false, offset={x:0,y:0};
const dragMove=(e)=>{ if(!isDragging) return; const clientX=e.touches?e.touches[0].clientX:e.clientX; const clientY=e.touches?e.touches[0].clientY:e.clientY; panel.style.left = (clientX - offset.x) + 'px'; panel.style.top = (clientY - offset.y) + 'px'; panel.style.transform = 'translate(0, 0)'; };
dragHandle.addEventListener('mousedown', (e)=>{ if(e.target.hasAttribute('contenteditable')) return; isDragging=true; offset.x = e.clientX - panel.offsetLeft; offset.y = e.clientY - panel.offsetTop; });
dragHandle.addEventListener('touchstart', (e)=>{ if(e.target.hasAttribute('contenteditable')) return; isDragging=true; const t=e.touches[0]; offset.x = t.clientX - panel.offsetLeft; offset.y = t.clientY - panel.offsetTop; });
document.addEventListener('mousemove', dragMove); document.addEventListener('touchmove', dragMove); document.addEventListener('mouseup', ()=>isDragging=false); document.addEventListener('touchend', ()=>isDragging=false);
</script>

</body>
</html>
